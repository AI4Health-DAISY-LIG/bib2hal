# Publishes the documentation website (docs/) on GitHub Pages.
# Runs when docs/ changes on main, manually from the Actions tab, and after each release (called by release.yml).
name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version number into the pages
        run: |
          v=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('bib2hal/__init__.py').read()).group(1))")
          sed -i "s/__BIB2HAL_VERSION__/v$v/g" docs/*.html docs/assets/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
